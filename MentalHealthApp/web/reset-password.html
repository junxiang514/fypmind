<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password – MindApp</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #e8f4fd 0%, #f0f9ff 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .card {
        background: #fff;
        border-radius: 16px;
        padding: 40px 36px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 4px 24px rgba(0, 122, 255, 0.10);
      }

      .logo {
        text-align: center;
        margin-bottom: 8px;
        font-size: 32px;
      }

      h1 {
        text-align: center;
        font-size: 22px;
        font-weight: 700;
        color: #1a1a2e;
        margin-bottom: 6px;
      }

      .subtitle {
        text-align: center;
        font-size: 14px;
        color: #666;
        margin-bottom: 28px;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #444;
        margin-bottom: 6px;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid #ddd;
        border-radius: 10px;
        font-size: 15px;
        color: #1a1a2e;
        outline: none;
        transition: border-color 0.2s;
        margin-bottom: 18px;
      }

      input:focus { border-color: #007AFF; }

      button {
        width: 100%;
        padding: 14px;
        background: #007AFF;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, opacity 0.2s;
        margin-top: 4px;
      }

      button:hover { background: #005ecb; }
      button:disabled { opacity: 0.6; cursor: not-allowed; }

      .message {
        margin-top: 18px;
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 14px;
        text-align: center;
        display: none;
      }

      .message.success {
        background: #e6f7ee;
        color: #1a7a47;
        border: 1px solid #a8e0bf;
        display: block;
      }

      .message.error {
        background: #fdecea;
        color: #c0392b;
        border: 1px solid #f5b7b1;
        display: block;
      }

      .invalid-state {
        text-align: center;
        color: #c0392b;
        font-size: 15px;
        padding: 20px 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">🧠</div>
      <h1>Set New Password</h1>
      <p class="subtitle">Enter your new password below to complete the reset.</p>

      <div id="form-area">
        <form id="reset-form">
        <label for="new-password">New Password</label>
        <input
          id="new-password"
          type="password"
          placeholder="Enter new password"
          autocomplete="new-password"
        />

        <label for="confirm-password">Confirm Password</label>
        <input
          id="confirm-password"
          type="password"
          placeholder="Confirm new password"
          autocomplete="new-password"
        />

        <button id="submit-btn" type="submit">Update Password</button>
        <div id="message" class="message"></div>
        </form>
      </div>

      <div id="invalid-area" class="invalid-state" style="display:none;">
        ⚠️ This reset link is invalid or has expired.<br /><br />
        Please request a new password reset from the app.
      </div>
    </div>

    <script>
      const SUPABASE_URL = 'https://lucksqjirrzltjerivrg.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1Y2tzcWppcnJ6bHRqZXJpdnJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxMzAxMzcsImV4cCI6MjA4MjcwNjEzN30.66UoDYr3Rd9ChUNENLTzvk-MR3LPsC0n7Ga3ivS2TpU';

      const supabaseGlobal = window.supabase || window.supabaseJs;
      const supabase = supabaseGlobal?.createClient?.(SUPABASE_URL, SUPABASE_ANON_KEY);

      // Parse tokens from URL hash: #access_token=...&refresh_token=...
      function getHashParams() {
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        return {
          access_token: params.get('access_token'),
          refresh_token: params.get('refresh_token'),
          type: params.get('type'),
        };
      }

      // Parse query params: ?code=... or ?token_hash=...&type=recovery
      function getQueryParams() {
        const params = new URLSearchParams(window.location.search);
        return {
          code: params.get('code'),
          token_hash: params.get('token_hash'),
          type: params.get('type'),
          access_token: params.get('access_token'),
          refresh_token: params.get('refresh_token'),
        };
      }

      function showInvalid(message) {
        document.getElementById('form-area').style.display = 'none';
        document.getElementById('invalid-area').style.display = 'block';
        if (message) {
          document.getElementById('invalid-area').innerHTML = `⚠️ ${message}<br /><br />Please request a new password reset from the app.`;
        }
      }

      async function init() {
        if (!supabase) {
          showInvalid('Reset page failed to load correctly.');
          return;
        }

        const hash = getHashParams();
        const query = getQueryParams();

        // Flow A: access/refresh tokens in hash (most common)
        if (hash.access_token && hash.refresh_token) {
          const { error } = await supabase.auth.setSession({
            access_token: hash.access_token,
            refresh_token: hash.refresh_token,
          });
          if (error) {
            showInvalid(error.message || 'This reset link is invalid or expired.');
          }
          return;
        }

        // Flow B: tokens in query
        if (query.access_token && query.refresh_token) {
          const { error } = await supabase.auth.setSession({
            access_token: query.access_token,
            refresh_token: query.refresh_token,
          });
          if (error) {
            showInvalid(error.message || 'This reset link is invalid or expired.');
          }
          return;
        }

        // Flow C: PKCE/code flow
        if (query.code) {
          const { error } = await supabase.auth.exchangeCodeForSession(query.code);
          if (error) {
            showInvalid(error.message || 'This reset link is invalid or expired.');
          }
          return;
        }

        const { error } = await supabase.auth.verifyOtp({
          type: 'recovery',
          token_hash: query.token_hash || '',
        });

        if (error) {
          showInvalid(error.message || 'This reset link is invalid or expired.');
        }
      }

      async function handleReset(event) {
        event?.preventDefault?.();

        const newPassword = document.getElementById('new-password').value.trim();
        const confirmPassword = document.getElementById('confirm-password').value.trim();
        const btn = document.getElementById('submit-btn');
        const msgEl = document.getElementById('message');

        msgEl.className = 'message';
        msgEl.textContent = '';

        if (!newPassword || !confirmPassword) {
          msgEl.className = 'message error';
          msgEl.textContent = 'Please fill in both fields.';
          return;
        }

        if (newPassword.length < 6) {
          msgEl.className = 'message error';
          msgEl.textContent = 'Password must be at least 6 characters.';
          return;
        }

        if (newPassword !== confirmPassword) {
          msgEl.className = 'message error';
          msgEl.textContent = 'Passwords do not match.';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Updating…';

        const { error } = await supabase.auth.updateUser({ password: newPassword });

        if (error) {
          msgEl.className = 'message error';
          msgEl.textContent = error.message || 'Failed to update password. Please try again.';
          btn.disabled = false;
          btn.textContent = 'Update Password';
        } else {
          msgEl.className = 'message success';
          msgEl.textContent = '✅ Password updated successfully! You can now log in with your new password.';
          document.getElementById('new-password').value = '';
          document.getElementById('confirm-password').value = '';
          btn.disabled = true;
          btn.textContent = 'Done';
          await supabase.auth.signOut();
        }
      }

      document.getElementById('reset-form').addEventListener('submit', handleReset);
      init();
    </script>
  </body>
</html>
